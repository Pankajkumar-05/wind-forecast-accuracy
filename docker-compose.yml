services:
  backend:
    build: ./backend
    environment:
      # Business rule (assumption, see README). Override in a root .env file if needed.
      DECISION_CUTOFF_TIME: ${DECISION_CUTOFF_TIME:-09:00}
      DECISION_TIMEZONE: ${DECISION_TIMEZONE:-Europe/London}
      DECISION_DAYS_AHEAD: ${DECISION_DAYS_AHEAD:-1}
      FORECAST_RESOLUTION_MINUTES: ${FORECAST_RESOLUTION_MINUTES:-60}
      MAPE_MIN_ACTUAL_MW: ${MAPE_MIN_ACTUAL_MW:-50}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Cache raw Elexon responses for fully historical periods across restarts.
      CACHE_DIR: /cache
    volumes:
      - elexon-cache:/cache
    ports:
      - "8000:8000" # API + interactive docs at http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80" # Dashboard at http://localhost:8080

volumes:
  elexon-cache:
